[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  timeout = 15

[dev]
  command = "npm run dev"
  port    = 8890

# ── Clean URLs (remove .html) ──────────────────────────────────────
[[redirects]]
  from   = "/timer"
  to     = "/index.html"
  status = 200

[[redirects]]
  from   = "/relic"
  to     = "/relic.html"
  status = 200

[[redirects]]
  from   = "/elite"
  to     = "/elite.html"
  status = 200

[[redirects]]
  from   = "/potion"
  to     = "/potion.html"
  status = 200

[[redirects]]
  from   = "/class"
  to     = "/class.html"
  status = 200

# SPA fallback — must be last
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
